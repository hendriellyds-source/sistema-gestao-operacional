name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEMO_MODE: 'true'
      INTEGRATIONS_ENABLED: 'false'
      AUTH_COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt -r requirements-dev.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Compile
        run: python -m compileall -q app
      - name: Python tests
        run: python -m pytest -q --junitxml=test-results.xml
      - name: JavaScript tests
        run: node --test tests/*.test.js
      - name: Preserve test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: test-results.xml
          if-no-files-found: ignore
  docker:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and start demo
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Exercise demo over HTTP
        run: python3 scripts/smoke_demo.py
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down --volumes
